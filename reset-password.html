<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · CarBuddy</title>
<meta name="description" content="Reset your CarBuddy password.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap wrap-narrow section">
  <div class="card card-pad-lg">
    <h1 style="font-size:1.7rem">Reset your password</h1>
    <p class="muted small">We'll email you a link to choose a new one.</p>
    <div id="msg"></div>
    <form id="resetForm" novalidate>
      <label class="field"><span>Email</span>
        <input type="email" id="email" autocomplete="email" required placeholder="you@example.com"></label>
      <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Send reset link</button>
    </form>
    <p class="small muted mt-3 mb-0 center"><a href="login.html">Back to log in</a></p>
  </div>
</main>
<div id="footer"></div>
<script type="module" src="page-reset-password.js"></script>
</body>
</html>
