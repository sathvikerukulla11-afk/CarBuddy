<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · CarBuddy</title>
<meta name="description" content="Sign in to your CarBuddy account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap wrap-narrow section">
  <div class="card card-pad-lg">
    <h1 style="font-size:1.7rem">Welcome back</h1>
    <p class="muted small">Sign in to see your rides, requests, and notifications.</p>
    <div id="msg"></div>
    <form id="loginForm" novalidate>
      <label class="field"><span>Email</span>
        <input type="email" id="email" autocomplete="email" required placeholder="you@example.com"></label>
      <label class="field"><span>Password</span>
        <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••"></label>
      <button class="btn btn-primary btn-block btn-lg" id="submitBtn" type="submit">Log in</button>
    </form>
    <div class="row-between mt-3 small">
      <a href="reset-password.html">Forgot your password?</a>
      <span class="muted">New here? <a href="signup.html">Create an account</a></span>
    </div>
  </div>
</main>
<div id="footer"></div>
<script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
