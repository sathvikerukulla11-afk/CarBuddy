<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password · CarBuddy</title>
<meta name="description" content="Set a new CarBuddy password.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap wrap-narrow section">
  <div class="card card-pad-lg">
    <h1 style="font-size:1.7rem">Choose a new password</h1>
    <div id="msg"></div>
    <form id="updateForm" novalidate>
      <label class="field"><span>New password</span>
        <input type="password" id="password" autocomplete="new-password" required minlength="8"></label>
      <label class="field"><span>Confirm new password</span>
        <input type="password" id="confirm" autocomplete="new-password" required minlength="8"></label>
      <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Update password</button>
    </form>
  </div>
</main>
<div id="footer"></div>
<script type="module" src="assets/js/pages/update-password.js"></script>
</body>
</html>
