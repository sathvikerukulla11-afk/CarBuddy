<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2136">
<title>Choose a new password · CarBuddy</title>
<meta name="description" content="Set a new CarBuddy password.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CarBuddy">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap wrap-narrow section" style="padding-block:clamp(40px,7vw,88px)">
  <div class="card card-pad-lg" style="box-shadow:var(--shadow)">
    <h1 style="font-size:1.75rem;letter-spacing:-.032em">Choose a new password</h1>
    <div id="msg"></div>
    <form id="updateForm" novalidate>
      <label class="field"><span>New password</span>
        <input type="password" id="password" autocomplete="new-password" required minlength="8"></label>
      <label class="field"><span>Confirm new password</span>
        <input type="password" id="confirm" autocomplete="new-password" required minlength="8"></label>
      <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Update password</button>
    </form>
  </div>
</main>
<div id="footer"></div>
<script type="module" src="page-update-password.js"></script>
</body>
</html>
