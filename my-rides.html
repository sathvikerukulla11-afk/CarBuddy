<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2136">
<title>My Rides · CarBuddy</title>
<meta name="description" content="Rides you're driving, rides you've joined, and pending requests.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CarBuddy">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap section-tight">
  <a class="back-link" href="dashboard.html"><span aria-hidden="true">←</span> Back to Dashboard</a>
  <div class="row-between mb-4">
    <div style="max-width:46ch">
      <h1 style="font-size:clamp(1.8rem,3.6vw,2.4rem)">My rides</h1>
      <p class="lede mb-0">Everything you're driving or riding, plus anyone waiting on you.</p>
    </div>
    <div class="row"><a class="btn btn-secondary" href="find-ride.html">Find a Ride</a>
      <a class="btn btn-primary" href="post-ride.html">Post a Ride</a></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="driving" role="tab">Rides I'm Driving</button>
    <button class="tab" data-tab="joining" role="tab">Rides I'm Riding</button>
    <button class="tab" data-tab="requests" role="tab">Requests to me <span class="badge" id="reqCount">0</span></button>
    <button class="tab" data-tab="sent" role="tab">My requests</button>
  </div>

  <div id="panel"><div class="skeleton" style="height:220px"></div></div>
</main>
<div id="footer"></div>
<script type="module" src="page-my-rides.js"></script>
</body>
</html>
