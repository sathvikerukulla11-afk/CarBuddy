<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B2136">
<title>Find a Ride · CarBuddy</title>
<meta name="description" content="Browse current rides, filter by distance, and request a seat.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="nav"></div>

<main class="wrap section-tight">
  <a class="back-link" href="dashboard.html">Back to Dashboard</a>

  <header class="mb-4" style="max-width:48ch">
    <h1 style="font-size:clamp(1.8rem,3.6vw,2.4rem)">Where are you going?</h1>
    <p class="lede mb-0">Find someone already heading your way.</p>
  </header>

  <!-- search -->
  <form class="search-panel mb-4" id="searchForm">
    <div class="search-row">
      <label class="field"><span>From</span>
        <input type="search" id="origin" placeholder="Frisco, TX" autocomplete="off"></label>
      <label class="field"><span>To</span>
        <input type="search" id="destination" placeholder="Plano, TX" autocomplete="off"></label>
      <label class="field"><span>Date</span>
        <input type="date" id="date"></label>
      <button type="submit" class="btn btn-primary" id="searchBtn">Search</button>
    </div>

    <div class="row-between mt-2">
      <button type="button" class="filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="filtersBody">
        <span id="filtersLabel">More filters</span>
      </button>
      <button type="button" class="btn btn-ghost btn-sm" id="clearBtn">Clear all</button>
    </div>

    <div class="filters-body hidden" id="filtersBody">
      <!-- distance -->
      <fieldset style="border:0;padding:0;margin:0 0 20px;grid-column:1/-1">
        <legend class="label" style="padding:0">Distance from your pickup point</legend>
        <div class="row" style="gap:8px">
          <button type="button" class="btn btn-secondary btn-sm" id="useLocationBtn">Use my location</button>
          <button type="button" class="btn btn-ghost btn-sm hidden" id="useHomeBtn"></button>
          <button type="button" class="btn btn-ghost btn-sm hidden" id="clearLocationBtn">Clear</button>
        </div>
        <p class="hint" id="locationStatus">Set a location to see only rides starting near you.</p>
        <div id="radiusWrap" class="hidden">
          <div class="row" style="gap:16px;align-items:center">
            <input type="range" id="radius" min="1" max="100" step="1" value="10" style="flex:1;min-width:140px">
            <output for="radius" id="radiusOut" class="badge badge-brand" style="min-width:96px;justify-content:center">Within 10 mi</output>
          </div>
        </div>
      </fieldset>

      <label class="field"><span>Earliest time</span><input type="time" id="timeFrom"></label>
      <label class="field"><span>Latest time</span><input type="time" id="timeTo"></label>

      <label class="field"><span>Seats you need</span>
        <select id="minSeats">
          <option value="1">1 seat</option><option value="2">2 seats</option>
          <option value="3">3 seats</option><option value="4">4 seats</option>
        </select></label>

      <label class="field"><span>Maximum contribution</span>
        <select id="maxContribution">
          <option value="">Any amount</option><option value="0">No contribution</option>
          <option value="5">Up to $5</option><option value="10">Up to $10</option>
          <option value="20">Up to $20</option><option value="50">Up to $50</option>
        </select></label>

      <label class="check" style="grid-column:1/-1;margin:0"><input type="checkbox" id="hideFull" checked>
        <span>Hide rides that are already full</span></label>
    </div>
  </form>

  <!-- results -->
  <div class="sortbar">
    <div>
      <h2 style="font-size:1.22rem;margin:0">Available rides</h2>
      <p class="small muted mb-0" id="resultCount"></p>
    </div>
    <div class="sort-chips" role="group" aria-label="Sort rides">
      <button type="button" class="sort-chip active" data-sort="soonest">Recommended</button>
      <button type="button" class="sort-chip" data-sort="distance">Nearest</button>
      <button type="button" class="sort-chip" data-sort="cheapest">Lowest contribution</button>
      <button type="button" class="sort-chip" data-sort="rating">Best rated</button>
    </div>
    <select id="sort" class="hidden" aria-hidden="true" tabindex="-1">
      <option value="soonest">Recommended</option>
      <option value="distance">Nearest</option>
      <option value="seats">Most seats</option>
      <option value="cheapest">Lowest contribution</option>
      <option value="rating">Best rated</option>
    </select>
  </div>

  <div id="results"></div>
</main>

<div id="footer"></div>
<script type="module" src="page-find-ride.js"></script>
</body>
</html>
